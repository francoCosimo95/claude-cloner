name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.3"
    validations:
      required: true
  - type: input
    id: claude
    attributes:
      label: Claude desktop version
      placeholder: "4.4212.0"
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Command output
      description: Paste the output of the failing command and of `cloner list`. Remove anything private.
      render: shell
