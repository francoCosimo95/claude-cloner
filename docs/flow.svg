<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t">
  <title id="t">The process: cloner add, sign in, then optionally cloner copy</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14171d"/><stop offset="1" stop-color="#0b0d12"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8b93a1"/></marker>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <g>
      <rect x="40" y="40" width="340" height="210" rx="22" fill="#171b22" stroke="#2a303b"/>
      <circle cx="90" cy="92" r="26" fill="#1F73F2" stroke="#ffffff" stroke-width="4"/>
      <text x="90" y="102" text-anchor="middle" font-size="30" font-weight="800" fill="#ffffff">1</text>
      <text x="130" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" font-weight="700" fill="#ffffff">cloner add</text>
      <text x="70" y="156" font-size="21" fill="#aab2c0">A new Claude with</text>
      <text x="70" y="188" font-size="21" fill="#aab2c0">its own login and data.</text>
    </g>
    <g>
      <rect x="430" y="40" width="340" height="210" rx="22" fill="#171b22" stroke="#2a303b"/>
      <circle cx="480" cy="92" r="26" fill="#219E4F" stroke="#ffffff" stroke-width="4"/>
      <text x="480" y="102" text-anchor="middle" font-size="30" font-weight="800" fill="#ffffff">2</text>
      <text x="520" y="100" font-size="27" font-weight="700" fill="#ffffff">Open and sign in</text>
      <text x="460" y="156" font-size="21" fill="#aab2c0">Pick the account you want.</text>
      <text x="460" y="188" font-size="21" fill="#aab2c0">Use a private browser window.</text>
    </g>
    <g>
      <rect x="820" y="40" width="340" height="210" rx="22" fill="#171b22" stroke="#2a303b"/>
      <circle cx="870" cy="92" r="26" fill="#8C4FD9" stroke="#ffffff" stroke-width="4"/>
      <text x="870" y="102" text-anchor="middle" font-size="30" font-weight="800" fill="#ffffff">3</text>
      <text x="910" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" font-weight="700" fill="#ffffff">cloner copy 1 2</text>
      <text x="850" y="156" font-size="21" fill="#aab2c0">Optional. Skills, memory</text>
      <text x="850" y="188" font-size="21" fill="#aab2c0">and settings come along.</text>
    </g>
    <path d="M392 145 H418" stroke="#8b93a1" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M782 145 H808" stroke="#8b93a1" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="600" y="292" text-anchor="middle" font-size="22" fill="#8b93a1">Close the profile before copying. Replaced files are backed up.</text>
  </g>
</svg>
