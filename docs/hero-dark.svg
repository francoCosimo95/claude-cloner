<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d">
  <title id="t">claude-cloner</title>
  <desc id="d">Two app icons with badges 2 and 3, the name claude-cloner and the commands cloner add and cloner copy 1 2.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14171d"/><stop offset="1" stop-color="#0b0d12"/></linearGradient>
    <radialGradient id="g1"><stop offset="0" stop-color="#1F73F2" stop-opacity="0.45"/><stop offset="1" stop-color="#1F73F2" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2"><stop offset="0" stop-color="#8C4FD9" stop-opacity="0.45"/><stop offset="1" stop-color="#8C4FD9" stop-opacity="0"/></radialGradient>
    <radialGradient id="g3"><stop offset="0" stop-color="#219E4F" stop-opacity="0.45"/><stop offset="1" stop-color="#219E4F" stop-opacity="0"/></radialGradient>
    <linearGradient id="ic" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a5878"/><stop offset="1" stop-color="#232c42"/></linearGradient>
    <g id="app">
      <rect width="190" height="190" rx="44" fill="url(#ic)"/>
      <rect x="40" y="52" width="110" height="86" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.92" stroke-width="8"/>
      <rect x="40" y="52" width="110" height="24" rx="12" fill="#ffffff" fill-opacity="0.92"/>
    </g>
  </defs>
  <rect width="1200" height="600" rx="24" fill="url(#bg)"/>
  <circle cx="230" cy="130" r="420" fill="url(#g1)"/>
  <circle cx="980" cy="470" r="440" fill="url(#g2)"/>
  <circle cx="600" cy="600" r="380" fill="url(#g3)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <use href="#app" x="400" y="90"/>
    <use href="#app" x="610" y="90"/>
    <circle cx="560" cy="250" r="40" fill="#1F73F2" stroke="#ffffff" stroke-width="6"/>
    <text x="560" y="266" font-size="46" font-weight="800" fill="#ffffff">2</text>
    <circle cx="770" cy="250" r="40" fill="#219E4F" stroke="#ffffff" stroke-width="6"/>
    <text x="770" y="266" font-size="46" font-weight="800" fill="#ffffff">3</text>
    <text x="600" y="400" font-size="92" font-weight="800" fill="#ffffff">claude-cloner</text>
    <text x="600" y="452" font-size="30" fill="#aab2c0">Two Claudes. Two accounts. One Mac.</text>
    <rect x="290" y="492" width="620" height="68" rx="18" fill="#0a0c10" stroke="#252a33"/>
    <text x="600" y="536" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28" fill="#e6e9ef">$ cloner add &amp;&amp; cloner copy 1 2</text>
  </g>
