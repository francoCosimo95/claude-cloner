<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d">
  <title id="t">Watch the claude-cloner demo video</title>
  <desc id="d">Two app icons with badges 2 and 3, the name claude-cloner and a play button.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14171d"/><stop offset="1" stop-color="#0b0d12"/></linearGradient>
    <radialGradient id="g1"><stop offset="0" stop-color="#1F73F2" stop-opacity="0.45"/><stop offset="1" stop-color="#1F73F2" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2"><stop offset="0" stop-color="#8C4FD9" stop-opacity="0.45"/><stop offset="1" stop-color="#8C4FD9" stop-opacity="0"/></radialGradient>
    <radialGradient id="g3"><stop offset="0" stop-color="#219E4F" stop-opacity="0.45"/><stop offset="1" stop-color="#219E4F" stop-opacity="0"/></radialGradient>
    <linearGradient id="ic" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a5878"/><stop offset="1" stop-color="#232c42"/></linearGradient>
    <g id="app">
      <rect width="190" height="190" rx="44" fill="url(#ic)"/>
      <rect x="40" y="52" width="110" height="86" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.92" stroke-width="8"/>
      <rect x="40" y="52" width="110" height="24" rx="12" fill="#ffffff" fill-opacity="0.92"/>
    </g>
  </defs>
  <rect width="1280" height="720" rx="24" fill="url(#bg)"/>
  <circle cx="240" cy="150" r="460" fill="url(#g1)"/>
  <circle cx="1040" cy="560" r="480" fill="url(#g2)"/>
  <circle cx="640" cy="720" r="420" fill="url(#g3)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <use href="#app" x="435" y="80"/>
    <use href="#app" x="655" y="80"/>
    <circle cx="595" cy="240" r="40" fill="#1F73F2" stroke="#ffffff" stroke-width="6"/>
    <text x="595" y="256" font-size="46" font-weight="800" fill="#ffffff">2</text>
    <circle cx="815" cy="240" r="40" fill="#219E4F" stroke="#ffffff" stroke-width="6"/>
    <text x="815" y="256" font-size="46" font-weight="800" fill="#ffffff">3</text>
    <text x="640" y="400" font-size="96" font-weight="800" fill="#ffffff">claude-cloner</text>
    <text x="640" y="452" font-size="30" fill="#aab2c0">Two Claudes. Two accounts. One Mac.</text>
    <circle cx="640" cy="560" r="52" fill="#ffffff" fill-opacity="0.95"/>
    <path d="M624 534 L624 586 L670 560 z" fill="#14171d"/>
    <text x="640" y="664" font-size="28" fill="#aab2c0">Watch the 28 second demo</text>
  </g>
